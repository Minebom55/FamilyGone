[package]
name = "process_watcher"
version = "0.1.0"
edition = "2024"

[build-dependencies]
embed-manifest = "1.4"



[dependencies]
sysinfo = "0.40.4"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "winnt", "winuser", "sysinfoapi"] }
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tray-notification",
    "message-window",
    "menu",
    "cursor"
] }
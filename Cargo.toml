[package]
name = "process_watcher"
version = "0.1.0"
edition = "2024"

[build-dependencies]
embed-manifest = "1.4"
winresource = "0.1"

[dependencies]
sysinfo = "0.40.4"

[target.'cfg(target_os = "windows")'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tray-notification",
    "message-window",
    "menu",
    "cursor"
] }